<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Afterburner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b1016; }
  body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color:#dfe9f3; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }

  #overlay {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(10,18,28,.82), rgba(4,7,11,.96));
    backdrop-filter:blur(3px); z-index:10; text-align:center; padding:24px;
  }
  #overlay.hidden { display:none; }
  .panel { max-width:620px; width:100%; }
  h1 {
    font-size:clamp(34px,8vw,64px); letter-spacing:.18em; font-weight:800;
    color:#f4f8fc; text-shadow:0 0 24px rgba(90,190,255,.55); margin-bottom:6px;
  }
  .sub { color:#6f8ba6; letter-spacing:.3em; font-size:12px; margin-bottom:26px; text-transform:uppercase; }
  .keys { display:grid; grid-template-columns:auto 1fr; gap:8px 16px; max-width:380px;
          margin:0 auto 28px; text-align:left; font-size:13px; color:#9db4c9; }
  .keys b { color:#ffd166; font-weight:600; white-space:nowrap; }
  .btn {
    display:inline-block; padding:13px 34px; border:1px solid #4aa8ff;
    color:#cfe9ff; background:rgba(40,120,200,.14); letter-spacing:.2em; font-size:14px;
    cursor:pointer; text-transform:uppercase; transition:.15s; font-family:inherit;
  }
  .btn:hover { background:rgba(70,170,255,.3); box-shadow:0 0 22px rgba(74,168,255,.45); color:#fff; }
  .stats { color:#8fa8bd; font-size:14px; line-height:2; margin-bottom:22px; }
  .stats span { color:#ffd166; }
  .dead h1 { color:#ff6b6b; text-shadow:0 0 24px rgba(255,80,80,.5); }
  .hint { margin-top:20px; font-size:11px; color:#50657a; letter-spacing:.12em; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="overlay">
  <div class="panel" id="panel"></div>
</div>

<script>
(() => {
"use strict";

// ---------------------------------------------------------------- setup
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const panel = document.getElementById("panel");

let VW = 0, VH = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = VW * DPR; canvas.height = VH * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

const WORLD = 7000;              // square arena, centred on 0,0
const HALF = WORLD / 2;
const TAU = Math.PI * 2;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };
// shortest signed angular difference, result in (-PI, PI]
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d <= -Math.PI) d += TAU; return d; };

// ---------------------------------------------------------------- audio
let actx = null, noiseBuf = null, master = null;
function initAudio() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain();
  master.gain.value = 0.35;
  master.connect(actx.destination);
  const len = actx.sampleRate * 1.2;
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}
function tone(freq, dur, type, vol, slideTo) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime + dur);
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(master); o.start(); o.stop(actx.currentTime + dur);
}
function noise(dur, vol, cut, slideCut) {
  if (!actx || !noiseBuf) return;
  const s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
  s.buffer = noiseBuf; f.type = "lowpass";
  f.frequency.setValueAtTime(cut, actx.currentTime);
  if (slideCut) f.frequency.exponentialRampToValueAtTime(slideCut, actx.currentTime + dur);
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(); s.stop(actx.currentTime + dur);
}
const sfx = {
  gun:    () => { tone(rand(620, 760), 0.06, "square", 0.08, 180); noise(0.05, 0.1, 3000); },
  enemyGun: () => { tone(rand(300, 360), 0.05, "square", 0.03, 120); },
  boom:   (big) => { noise(big ? 0.75 : 0.4, big ? 0.6 : 0.3, big ? 1400 : 900, 60);
                     tone(big ? 70 : 110, big ? 0.6 : 0.3, "sine", big ? 0.4 : 0.2, 30); },
  missile:() => { tone(180, 0.5, "sawtooth", 0.12, 900); noise(0.5, 0.12, 700, 2500); },
  hit:    () => { noise(0.1, 0.25, 2200, 400); },
  lock:   () => { tone(1250, 0.05, "square", 0.05); },
  pickup: () => { tone(620, 0.09, "sine", 0.14); setTimeout(() => tone(930, 0.13, "sine", 0.14), 70); },
  wave:   () => { tone(330, 0.2, "sine", 0.12); setTimeout(() => tone(495, 0.35, "sine", 0.12), 150); },
};

// ---------------------------------------------------------------- input
const keys = Object.create(null);
const mouse = { x: 0, y: 0, left: false, right: false, active: false };

addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === "KeyA" || e.code === "KeyD" || e.code === "ArrowLeft" || e.code === "ArrowRight") mouse.active = false;
  if (e.code === "KeyP" && game.state === "playing") game.paused = !game.paused;
  if (e.code === "Enter" && game.state !== "playing") startGame();
});
addEventListener("keyup", e => { keys[e.code] = false; });
canvas.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
canvas.addEventListener("mousedown", e => {
  initAudio();
  if (e.button === 0) mouse.left = true;
  if (e.button === 2) { mouse.right = true; e.preventDefault(); }
});
addEventListener("mouseup", e => { if (e.button === 0) mouse.left = false; if (e.button === 2) mouse.right = false; });
canvas.addEventListener("contextmenu", e => e.preventDefault());
addEventListener("blur", () => { for (const k in keys) keys[k] = false; mouse.left = mouse.right = false; });

const down = (...codes) => codes.some(c => keys[c]);

// ---------------------------------------------------------------- entities
const game = {
  state: "menu", paused: false, score: 0, wave: 0, kills: 0,
  waveTimer: 0, shake: 0, time: 0, hitFlash: 0, camX: 0, camY: 0,
  best: Number(localStorage.getItem("afterburner.best")) || 0,
};

let player, enemies, bullets, missiles, particles, pickups, clouds, rings;

function makePlayer() {
  return {
    x: 0, y: 0, angle: -Math.PI / 2, speed: 4.2,
    minSpeed: 2.2, maxSpeed: 8.5, turnRate: 0.052,
    hp: 100, maxHp: 100, r: 16,
    gunCd: 0, missiles: 6, maxMissiles: 6, missileCd: 0,
    lock: null, lockTime: 0, trail: [], invuln: 90, boost: 0, alive: true,
  };
}

const TYPES = {
  fighter: { hp: 30,  speed: 4.0, turn: 0.034, r: 15, color: "#d9534f", accent: "#ff9a8b",
             range: 720, fireCd: 34, spread: 0.10, score: 100, dmg: 7 },
  heavy:   { hp: 90,  speed: 2.9, turn: 0.019, r: 22, color: "#8b6ad6", accent: "#c0a9ff",
             range: 860, fireCd: 22, spread: 0.14, score: 250, dmg: 9 },
  ace:     { hp: 45,  speed: 5.6, turn: 0.050, r: 15, color: "#e8a33d", accent: "#ffe08a",
             range: 780, fireCd: 26, spread: 0.055, score: 300, dmg: 8 },
};

function spawnEnemy(type) {
  const t = TYPES[type];
  const a = Math.random() * TAU;
  const d = rand(1500, 2300);
  let x = clamp(player.x + Math.cos(a) * d, -HALF + 300, HALF - 300);
  let y = clamp(player.y + Math.sin(a) * d, -HALF + 300, HALF - 300);
  enemies.push({
    type, x, y, angle: Math.atan2(player.y - y, player.x - x),
    speed: t.speed, hp: t.hp, maxHp: t.hp, r: t.r,
    fireCd: rand(20, 80), mode: "pursue", modeTimer: 0,
    evadeDir: Math.random() < 0.5 ? 1 : -1, trail: [], flash: 0,
  });
}

function startWave() {
  game.wave++;
  const w = game.wave;
  const n = Math.min(3 + Math.floor(w * 0.9), 11);
  for (let i = 0; i < n; i++) {
    let t = "fighter";
    if (w >= 3 && i % 4 === 3) t = "heavy";
    if (w >= 5 && i % 3 === 2) t = "ace";
    setTimeout(() => { if (game.state === "playing") spawnEnemy(t); }, i * 260);
  }
  sfx.wave();
  banner("WAVE " + w, 150);
}

let bannerText = "", bannerTime = 0;
function banner(txt, t) { bannerText = txt; bannerTime = t; }

// ---------------------------------------------------------------- fx
function burst(x, y, n, col, spd, size, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rand(spd * 0.2, spd);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(life * 0.5, life), max: life, col, size: rand(size * 0.5, size) });
  }
}
function explode(x, y, big) {
  burst(x, y, big ? 46 : 26, "#ffd166", big ? 9 : 6, big ? 7 : 5, big ? 48 : 32);
  burst(x, y, big ? 30 : 16, "#ff6b35", big ? 6 : 4, big ? 11 : 8, big ? 62 : 40);
  burst(x, y, big ? 20 : 10, "#4a4a52", big ? 3 : 2, big ? 16 : 11, big ? 90 : 60);
  rings.push({ x, y, r: 6, max: big ? 190 : 110, life: 1 });
  game.shake = Math.min(game.shake + (big ? 16 : 9), 30);
  sfx.boom(big);
}

// ---------------------------------------------------------------- weapons
function fireGun(owner, isPlayer) {
  const t = isPlayer ? null : TYPES[owner.type];
  const spread = isPlayer ? 0.012 : t.spread;
  const dmg = isPlayer ? 9 : t.dmg;
  const speed = isPlayer ? 15 : 11;
  const n = isPlayer ? 2 : 1;
  for (let i = 0; i < n; i++) {
    const a = owner.angle + rand(-spread, spread);
    const off = isPlayer ? (i === 0 ? -11 : 11) : 0;
    const px = owner.x + Math.cos(a) * 20 + Math.cos(a + Math.PI / 2) * off;
    const py = owner.y + Math.sin(a) * 20 + Math.sin(a + Math.PI / 2) * off;
    bullets.push({
      x: px, y: py, px, py,
      vx: Math.cos(a) * speed + Math.cos(owner.angle) * owner.speed * 0.5,
      vy: Math.sin(a) * speed + Math.sin(owner.angle) * owner.speed * 0.5,
      life: isPlayer ? 60 : 70, friendly: isPlayer, dmg,
      col: isPlayer ? "#aef5ff" : "#ff8a5c",
    });
  }
  particles.push({ x: owner.x + Math.cos(owner.angle) * 22, y: owner.y + Math.sin(owner.angle) * 22,
    vx: 0, vy: 0, life: 4, max: 4, col: "#fff3c4", size: isPlayer ? 10 : 7 });
  isPlayer ? sfx.gun() : sfx.enemyGun();
}

function fireMissile() {
  if (player.missiles <= 0 || player.missileCd > 0) return;
  player.missiles--;
  player.missileCd = 42;
  const side = player.missiles % 2 === 0 ? 1 : -1;
  const a = player.angle;
  missiles.push({
    x: player.x + Math.cos(a + Math.PI / 2) * 14 * side,
    y: player.y + Math.sin(a + Math.PI / 2) * 14 * side,
    angle: a, speed: 5, target: player.lock, life: 230, armed: 10,
  });
  sfx.missile();
  game.shake = Math.min(game.shake + 3, 30);
}

// ---------------------------------------------------------------- update
function updatePlayer() {
  const p = player;
  if (!p.alive) return;

  // --- steering
  let turn = 0;
  if (down("KeyA", "ArrowLeft")) turn -= 1;
  if (down("KeyD", "ArrowRight")) turn += 1;
  if (turn === 0 && mouse.active) {
    const wx = p.x + (mouse.x - VW / 2), wy = p.y + (mouse.y - VH / 2);
    const want = Math.atan2(wy - p.y, wx - p.x);
    const d = angDiff(want, p.angle);
    turn = clamp(d / p.turnRate, -1, 1);
  }
  // tighter turns at low speed, like a real airframe
  const agility = p.turnRate * (1.35 - 0.5 * (p.speed / p.maxSpeed));
  p.angle += turn * agility;

  // --- throttle
  const boosting = down("KeyW", "ArrowUp", "ShiftLeft", "ShiftRight");
  const braking = down("KeyS", "ArrowDown");
  const want = boosting ? p.maxSpeed : braking ? p.minSpeed : 4.6;
  p.speed += clamp(want - p.speed, -0.14, 0.085);
  p.boost = boosting ? Math.min(p.boost + 0.12, 1) : Math.max(p.boost - 0.08, 0);

  p.x += Math.cos(p.angle) * p.speed;
  p.y += Math.sin(p.angle) * p.speed;

  // --- arena edge
  const edge = HALF - 120;
  if (Math.abs(p.x) > edge || Math.abs(p.y) > edge) {
    p.hp -= 0.16;
    game.hitFlash = Math.max(game.hitFlash, 0.25);
    p.x = clamp(p.x, -HALF, HALF); p.y = clamp(p.y, -HALF, HALF);
  }

  // --- trail
  p.trail.push({ x: p.x - Math.cos(p.angle) * 18, y: p.y - Math.sin(p.angle) * 18 });
  if (p.trail.length > 26) p.trail.shift();

  // --- weapons
  if (p.gunCd > 0) p.gunCd--;
  if (p.missileCd > 0) p.missileCd--;
  if (p.invuln > 0) p.invuln--;

  if ((mouse.left || down("Space")) && p.gunCd <= 0) { fireGun(p, true); p.gunCd = 5; }
  if ((mouse.right || down("KeyF", "KeyX")) && p.missileCd <= 0) fireMissile();

  // --- missile lock: nearest target inside the forward cone
  let best = null, bestD = Infinity;
  for (const e of enemies) {
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d > 1500) continue;
    const a = Math.atan2(e.y - p.y, e.x - p.x);
    if (Math.abs(angDiff(a, p.angle)) > 0.44) continue;
    if (d < bestD) { bestD = d; best = e; }
  }
  if (best !== p.lock) { p.lockTime = 0; if (best) sfx.lock(); }
  p.lock = best;
  if (best) p.lockTime = Math.min(p.lockTime + 1, 40);

  if (p.hp <= 0) killPlayer();
}

function killPlayer() {
  player.alive = false;
  explode(player.x, player.y, true);
  setTimeout(() => explode(player.x + rand(-30, 30), player.y + rand(-30, 30), false), 180);
  game.shake = 30;
  setTimeout(gameOver, 1200);
}

function updateEnemy(e) {
  const t = TYPES[e.type];
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy);
  const toPlayer = Math.atan2(dy, dx);
  const offBore = Math.abs(angDiff(toPlayer, e.angle));

  e.modeTimer--;
  if (e.modeTimer <= 0) {
    if (!player.alive) e.mode = "patrol";
    else if (d < 260) { e.mode = "evade"; e.modeTimer = 70; e.evadeDir = Math.random() < 0.5 ? 1 : -1; }
    else if (d > 1700) { e.mode = "pursue"; e.modeTimer = 60; }
    else {
      // if the player has a good firing angle on us, break away
      const playerOnTail = Math.abs(angDiff(Math.atan2(-dy, -dx), player.angle)) < 0.4 && d < 900;
      if (playerOnTail && Math.random() < 0.7) { e.mode = "evade"; e.modeTimer = rand(45, 90); e.evadeDir = Math.random() < 0.5 ? 1 : -1; }
      else { e.mode = "pursue"; e.modeTimer = rand(40, 90); }
    }
  }

  let want;
  if (e.mode === "evade") {
    want = e.angle + e.evadeDir * 0.6;
    e.speed += clamp(t.speed * 1.15 - e.speed, -0.1, 0.07);
  } else if (e.mode === "patrol") {
    want = e.angle + Math.sin(game.time * 0.01 + e.x * 0.001) * 0.3;
  } else {
    // lead the target so shots land where the player is going
    const lead = clamp(d / 13, 0, 32);
    const px = player.x + Math.cos(player.angle) * player.speed * lead;
    const py = player.y + Math.sin(player.angle) * player.speed * lead;
    want = Math.atan2(py - e.y, px - e.x);
    e.speed += clamp(t.speed - e.speed, -0.08, 0.05);
  }

  // steer away from the arena wall
  const edge = HALF - 500;
  if (Math.abs(e.x) > edge || Math.abs(e.y) > edge) want = Math.atan2(-e.y, -e.x);

  e.angle += clamp(angDiff(want, e.angle), -t.turn, t.turn);
  e.x += Math.cos(e.angle) * e.speed;
  e.y += Math.sin(e.angle) * e.speed;

  e.trail.push({ x: e.x - Math.cos(e.angle) * 16, y: e.y - Math.sin(e.angle) * 16 });
  if (e.trail.length > 16) e.trail.shift();
  if (e.flash > 0) e.flash--;

  if (e.fireCd > 0) e.fireCd--;
  if (player.alive && e.mode !== "evade" && d < t.range && offBore < 0.17 && e.fireCd <= 0) {
    fireGun(e, false);
    e.fireCd = t.fireCd + rand(0, 10);
  }
}

function damageEnemy(e, dmg, hx, hy) {
  e.hp -= dmg;
  e.flash = 5;
  burst(hx, hy, 5, "#ffd9a0", 3, 3, 16);
  sfx.hit();
  if (e.hp <= 0) {
    const t = TYPES[e.type];
    explode(e.x, e.y, e.type === "heavy");
    game.score += t.score;
    game.kills++;
    enemies.splice(enemies.indexOf(e), 1);
    if (Math.random() < 0.28) pickups.push({ x: e.x, y: e.y, kind: Math.random() < 0.6 ? "hp" : "ammo", life: 700, bob: 0 });
    return true;
  }
  return false;
}

function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.px = b.x; b.py = b.y;
    b.x += b.vx; b.y += b.vy;
    if (--b.life <= 0) { bullets.splice(i, 1); continue; }

    if (b.friendly) {
      let hit = false;
      for (const e of enemies) {
        if (dist2(b, e) < (e.r + 5) ** 2) { damageEnemy(e, b.dmg, b.x, b.y); hit = true; break; }
      }
      if (hit) { bullets.splice(i, 1); continue; }
    } else if (player.alive && player.invuln <= 0 && dist2(b, player) < (player.r + 5) ** 2) {
      player.hp -= b.dmg;
      game.hitFlash = 1;
      game.shake = Math.min(game.shake + 4, 30);
      burst(b.x, b.y, 7, "#ff9a6b", 3.5, 3, 18);
      sfx.hit();
      bullets.splice(i, 1);
      if (player.hp <= 0) killPlayer();
    }
  }
}

function updateMissiles() {
  for (let i = missiles.length - 1; i >= 0; i--) {
    const m = missiles[i];
    if (m.armed > 0) m.armed--;
    m.speed = Math.min(m.speed + 0.26, 13);

    if (m.target && enemies.indexOf(m.target) === -1) m.target = null;
    if (!m.target) {
      // re-acquire anything roughly ahead
      let best = null, bd = 900 ** 2;
      for (const e of enemies) {
        const d2 = dist2(m, e);
        if (d2 < bd && Math.abs(angDiff(Math.atan2(e.y - m.y, e.x - m.x), m.angle)) < 0.9) { bd = d2; best = e; }
      }
      m.target = best;
    }
    if (m.target) {
      const want = Math.atan2(m.target.y - m.y, m.target.x - m.x);
      m.angle += clamp(angDiff(want, m.angle), -0.085, 0.085);
    }

    m.x += Math.cos(m.angle) * m.speed;
    m.y += Math.sin(m.angle) * m.speed;

    particles.push({ x: m.x - Math.cos(m.angle) * 9, y: m.y - Math.sin(m.angle) * 9,
      vx: rand(-.4, .4), vy: rand(-.4, .4), life: 22, max: 22, col: "#c8d4e0", size: 5 });

    let dead = --m.life <= 0;
    if (m.armed <= 0) {
      for (const e of enemies) {
        if (dist2(m, e) < (e.r + 16) ** 2) {
          explode(m.x, m.y, false);
          // splash damage
          for (let k = enemies.length - 1; k >= 0; k--) {
            const o = enemies[k];
            const dd = Math.hypot(o.x - m.x, o.y - m.y);
            if (dd < 110) damageEnemy(o, o === e ? 70 : 30, o.x, o.y);
          }
          dead = true;
          break;
        }
      }
    }
    if (dead) { if (m.life <= 0) explode(m.x, m.y, false); missiles.splice(i, 1); }
  }
}

function updatePickups() {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.bob += 0.08;
    if (--p.life <= 0) { pickups.splice(i, 1); continue; }
    if (player.alive && dist2(p, player) < 42 ** 2) {
      if (p.kind === "hp") { player.hp = Math.min(player.maxHp, player.hp + 30); banner("+30 HULL", 60); }
      else { player.missiles = Math.min(player.maxMissiles, player.missiles + 3); banner("+3 MISSILES", 60); }
      burst(p.x, p.y, 14, p.kind === "hp" ? "#5ddba0" : "#ffd166", 4, 4, 26);
      sfx.pickup();
      pickups.splice(i, 1);
    }
  }
}

function updateFx() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.94; p.vy *= 0.94;
    if (--p.life <= 0) particles.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += (r.max - r.r) * 0.16;
    r.life -= 0.045;
    if (r.life <= 0) rings.splice(i, 1);
  }
  if (game.shake > 0) game.shake *= 0.88;
  if (game.hitFlash > 0) game.hitFlash -= 0.04;
  if (bannerTime > 0) bannerTime--;
}

function update() {
  game.time++;
  updatePlayer();
  for (const e of enemies) updateEnemy(e);
  updateBullets();
  updateMissiles();
  updatePickups();
  updateFx();

  if (enemies.length > 0) game.waveTimer = 0;
  else if (player.alive) {
    if (game.waveTimer === 0) game.waveTimer = 150;
    else if (game.waveTimer > 0 && --game.waveTimer === 0) { startWave(); game.waveTimer = -1; }
  }
}

// ---------------------------------------------------------------- render
function drawJet(x, y, angle, scale, body, accent, flash, boost) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);

  // exhaust flame
  if (boost > 0) {
    const l = 16 + boost * 26 + Math.sin(game.time * 0.9) * 4;
    const g = ctx.createLinearGradient(-18, 0, -18 - l, 0);
    g.addColorStop(0, "rgba(180,230,255,.95)");
    g.addColorStop(0.4, "rgba(90,170,255,.55)");
    g.addColorStop(1, "rgba(60,120,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-17, -4.5); ctx.lineTo(-18 - l, 0); ctx.lineTo(-17, 4.5);
    ctx.closePath(); ctx.fill();
  }

  const main = flash ? "#ffffff" : body;

  // wings (swept back)
  ctx.fillStyle = accent;
  ctx.beginPath();
  ctx.moveTo(4, -3); ctx.lineTo(-9, -21); ctx.lineTo(-15, -21); ctx.lineTo(-9, -3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(4, 3); ctx.lineTo(-9, 21); ctx.lineTo(-15, 21); ctx.lineTo(-9, 3);
  ctx.closePath(); ctx.fill();

  // tailplanes
  ctx.beginPath();
  ctx.moveTo(-13, -2.5); ctx.lineTo(-20, -10); ctx.lineTo(-23, -10); ctx.lineTo(-19, -2.5);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-13, 2.5); ctx.lineTo(-20, 10); ctx.lineTo(-23, 10); ctx.lineTo(-19, 2.5);
  ctx.closePath(); ctx.fill();

  // fuselage
  ctx.fillStyle = main;
  ctx.beginPath();
  ctx.moveTo(23, 0);
  ctx.lineTo(9, -4.5); ctx.lineTo(-14, -5); ctx.lineTo(-18, -3.8);
  ctx.lineTo(-18, 3.8); ctx.lineTo(-14, 5); ctx.lineTo(9, 4.5);
  ctx.closePath(); ctx.fill();

  // spine highlight + canopy
  ctx.fillStyle = "rgba(255,255,255,.22)";
  ctx.fillRect(-12, -1.6, 28, 1.6);
  ctx.fillStyle = flash ? "#fff" : "rgba(150,220,255,.9)";
  ctx.beginPath();
  ctx.ellipse(7, 0, 5.5, 3.2, 0, 0, TAU);
  ctx.fill();

  ctx.restore();
}

function drawShadow(x, y, angle, scale) {
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.translate(26, 34);
  drawJet(x, y, angle, scale, "#000", "#000", false, 0);
  ctx.restore();
}

function drawBackground(cx, cy) {
  // ground wash
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, "#16222e");
  g.addColorStop(1, "#0d141c");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  // grid, drawn in world space but offset so it tiles
  const S = 320;
  ctx.strokeStyle = "rgba(90,150,200,.07)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  const ox = -((cx - VW / 2) % S + S) % S;
  const oy = -((cy - VH / 2) % S + S) % S;
  for (let x = ox; x < VW; x += S) { ctx.moveTo(x, 0); ctx.lineTo(x, VH); }
  for (let y = oy; y < VH; y += S) { ctx.moveTo(0, y); ctx.lineTo(VW, y); }
  ctx.stroke();
}

function drawClouds(cx, cy, layer) {
  for (const c of clouds) {
    if (c.layer !== layer) continue;
    const p = c.layer === 0 ? 0.45 : 1.15;
    const sx = VW / 2 + (c.x - cx) * p;
    const sy = VH / 2 + (c.y - cy) * p;
    if (sx < -c.r * 2 || sx > VW + c.r * 2 || sy < -c.r * 2 || sy > VH + c.r * 2) continue;
    ctx.globalAlpha = c.a;
    ctx.fillStyle = c.layer === 0 ? "#8fb6d6" : "#cfe4f5";
    for (const b of c.blobs) {
      ctx.beginPath();
      ctx.ellipse(sx + b.x * p, sy + b.y * p, b.r * p, b.r * 0.62 * p, 0, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function drawTrail(trail, col, width) {
  if (trail.length < 2) return;
  for (let i = 1; i < trail.length; i++) {
    const t = i / trail.length;
    ctx.strokeStyle = col.replace("ALPHA", (t * 0.4).toFixed(3));
    ctx.lineWidth = width * t;
    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.stroke();
  }
}

function render() {
  const cx = player.x + (mouse.active ? (mouse.x - VW / 2) * 0.12 : 0);
  const cy = player.y + (mouse.active ? (mouse.y - VH / 2) * 0.12 : 0);

  game.camX = cx; game.camY = cy;

  drawBackground(cx, cy);
  drawClouds(cx, cy, 0);

  const sh = game.shake;
  ctx.save();
  ctx.translate(
    VW / 2 - cx + rand(-sh, sh),
    VH / 2 - cy + rand(-sh, sh)
  );

  // arena boundary
  ctx.strokeStyle = "rgba(255,90,90,.35)";
  ctx.lineWidth = 6;
  ctx.setLineDash([40, 28]);
  ctx.strokeRect(-HALF, -HALF, WORLD, WORLD);
  ctx.setLineDash([]);

  // pickups
  for (const p of pickups) {
    const bob = Math.sin(p.bob) * 4;
    const fade = p.life < 120 ? (Math.floor(p.life / 6) % 2 ? 0.25 : 1) : 1;
    ctx.globalAlpha = fade;
    ctx.save();
    ctx.translate(p.x, p.y + bob);
    ctx.rotate(p.bob * 0.3);
    ctx.fillStyle = p.kind === "hp" ? "rgba(93,219,160,.22)" : "rgba(255,209,102,.22)";
    ctx.strokeStyle = p.kind === "hp" ? "#5ddba0" : "#ffd166";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(-11, -11, 22, 22); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = p.kind === "hp" ? "#5ddba0" : "#ffd166";
    ctx.font = "bold 15px ui-monospace, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(p.kind === "hp" ? "+" : "M", p.x, p.y + bob + 1);
    ctx.globalAlpha = 1;
  }

  // trails
  for (const e of enemies) drawTrail(e.trail, "rgba(255,140,110,ALPHA)", 4);
  if (player.alive) drawTrail(player.trail, "rgba(170,225,255,ALPHA)", 5);

  // shadows then planes
  for (const e of enemies) drawShadow(e.x, e.y, e.angle, e.type === "heavy" ? 1.35 : 1);
  if (player.alive) drawShadow(player.x, player.y, player.angle, 1.05);

  for (const e of enemies) {
    const t = TYPES[e.type];
    drawJet(e.x, e.y, e.angle, e.type === "heavy" ? 1.35 : 1, t.color, t.accent, e.flash > 0, 0.4);
    // health pip
    if (e.hp < e.maxHp) {
      const w = 34, h = 3.5;
      ctx.fillStyle = "rgba(0,0,0,.55)";
      ctx.fillRect(e.x - w / 2, e.y - e.r - 16, w, h);
      ctx.fillStyle = "#ff6b6b";
      ctx.fillRect(e.x - w / 2, e.y - e.r - 16, w * (e.hp / e.maxHp), h);
    }
  }

  if (player.alive) {
    const blink = player.invuln > 0 && Math.floor(game.time / 4) % 2 === 0;
    if (!blink) drawJet(player.x, player.y, player.angle, 1.05, "#3f8fd4", "#8fd3ff", false, 0.35 + player.boost * 0.65);
  }

  // lock reticle
  if (player.alive && player.lock) {
    const e = player.lock, locked = player.lockTime >= 30;
    const s = locked ? 26 : 26 + (40 - player.lockTime);
    ctx.strokeStyle = locked ? "#ff4d4d" : "rgba(255,210,100,.7)";
    ctx.lineWidth = 2;
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(locked ? 0 : game.time * 0.05);
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(s, s - 9); ctx.lineTo(s, s); ctx.lineTo(s - 9, s);
      ctx.stroke();
    }
    ctx.restore();
  }

  // missiles
  for (const m of missiles) {
    ctx.save();
    ctx.translate(m.x, m.y); ctx.rotate(m.angle);
    ctx.fillStyle = "#e8edf2";
    ctx.fillRect(-9, -2, 18, 4);
    ctx.fillStyle = "#ff6b35";
    ctx.beginPath(); ctx.moveTo(9, -2); ctx.lineTo(14, 0); ctx.lineTo(9, 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#9fb0c0";
    ctx.fillRect(-9, -5, 4, 10);
    ctx.restore();
  }

  // bullets
  ctx.lineCap = "round";
  for (const b of bullets) {
    ctx.strokeStyle = b.col;
    ctx.lineWidth = b.friendly ? 3.2 : 2.6;
    ctx.globalAlpha = Math.min(1, b.life / 12);
    ctx.beginPath();
    ctx.moveTo(b.px, b.py);
    ctx.lineTo(b.x + b.vx * 0.9, b.y + b.vy * 0.9);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.lineCap = "butt";

  // particles
  for (const p of particles) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.col;
    const s = p.size * (0.4 + a * 0.6);
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;

  // shockwaves
  for (const r of rings) {
    ctx.globalAlpha = Math.max(0, r.life) * 0.5;
    ctx.strokeStyle = "#ffd9a0";
    ctx.lineWidth = 3 * r.life;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  drawClouds(cx, cy, 1);
  drawHUD();
}

// ---------------------------------------------------------------- HUD
function drawHUD() {
  ctx.textBaseline = "alphabetic";

  // damage vignette
  if (game.hitFlash > 0) {
    const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.3, VW / 2, VH / 2, Math.max(VW, VH) * 0.7);
    g.addColorStop(0, "rgba(255,0,0,0)");
    g.addColorStop(1, "rgba(255,30,30," + (game.hitFlash * 0.55).toFixed(3) + ")");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);
  }

  // --- top left: hull + score
  ctx.font = "11px ui-monospace, monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = "#6f8ba6";
  ctx.fillText("HULL", 22, 32);

  const bw = 230, bh = 13;
  ctx.fillStyle = "rgba(0,0,0,.45)";
  ctx.fillRect(22, 40, bw, bh);
  const hpFrac = Math.max(0, player.hp / player.maxHp);
  ctx.fillStyle = hpFrac > 0.5 ? "#4fd48a" : hpFrac > 0.25 ? "#ffd166" : "#ff5c5c";
  ctx.fillRect(22, 40, bw * hpFrac, bh);
  ctx.strokeStyle = "rgba(190,215,235,.45)";
  ctx.lineWidth = 1;
  ctx.strokeRect(22.5, 40.5, bw, bh);
  ctx.fillStyle = "#dfe9f3";
  ctx.font = "bold 10px ui-monospace, monospace";
  ctx.fillText(Math.max(0, Math.ceil(player.hp)) + "%", 22 + bw + 10, 51);

  // throttle
  ctx.fillStyle = "#6f8ba6";
  ctx.font = "11px ui-monospace, monospace";
  ctx.fillText("THR", 22, 76);
  const tFrac = (player.speed - player.minSpeed) / (player.maxSpeed - player.minSpeed);
  ctx.fillStyle = "rgba(0,0,0,.45)";
  ctx.fillRect(52, 67, 160, 8);
  ctx.fillStyle = player.boost > 0.4 ? "#8fd3ff" : "#4a89c0";
  ctx.fillRect(52, 67, 160 * clamp(tFrac, 0, 1), 8);

  // missiles
  ctx.fillStyle = "#6f8ba6";
  ctx.fillText("MSL", 22, 100);
  for (let i = 0; i < player.maxMissiles; i++) {
    ctx.fillStyle = i < player.missiles ? "#ffd166" : "rgba(255,209,102,.16)";
    ctx.fillRect(52 + i * 15, 91, 9, 9);
  }

  // --- top right: score / wave
  ctx.textAlign = "right";
  ctx.font = "bold 30px ui-monospace, monospace";
  ctx.fillStyle = "#f4f8fc";
  ctx.fillText(String(game.score).padStart(6, "0"), VW - 22, 46);
  ctx.font = "11px ui-monospace, monospace";
  ctx.fillStyle = "#6f8ba6";
  ctx.fillText("WAVE " + game.wave + "   ·   BOGEYS " + enemies.length + "   ·   KILLS " + game.kills, VW - 22, 66);

  // --- gun reticle, pinned to the jet's actual screen position
  const scrX = VW / 2 - game.camX, scrY = VH / 2 - game.camY;
  if (player.alive) {
    // sit the pipper out along the gun line so it isn't buried under the airframe
    const rx = scrX + player.x + Math.cos(player.angle) * 95;
    const ry = scrY + player.y + Math.sin(player.angle) * 95;
    ctx.strokeStyle = player.lock && player.lockTime >= 30 ? "rgba(255,80,80,.9)" : "rgba(160,220,255,.55)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(rx, ry, 5, 0, TAU);
    ctx.moveTo(rx - 16, ry); ctx.lineTo(rx - 9, ry);
    ctx.moveTo(rx + 9, ry); ctx.lineTo(rx + 16, ry);
    ctx.moveTo(rx, ry - 16); ctx.lineTo(rx, ry - 9);
    ctx.moveTo(rx, ry + 9); ctx.lineTo(rx, ry + 16);
    ctx.stroke();
  }

  // --- off-screen threat arrows
  for (const e of enemies) {
    const sx = scrX + e.x, sy = scrY + e.y;
    if (sx > 40 && sx < VW - 40 && sy > 40 && sy < VH - 40) continue;
    const a = Math.atan2(e.y - player.y, e.x - player.x);
    const rad = Math.min(VW, VH) * 0.42;
    const ax = VW / 2 + Math.cos(a) * rad, ay = VH / 2 + Math.sin(a) * rad;
    ctx.save();
    ctx.translate(ax, ay); ctx.rotate(a);
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = TYPES[e.type].color;
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -6); ctx.lineTo(-6, 6); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // --- radar
  const R = 78, RX = VW - R - 28, RY = VH - R - 28;
  ctx.fillStyle = "rgba(8,16,24,.72)";
  ctx.beginPath(); ctx.arc(RX, RY, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgba(120,190,240,.3)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(RX, RY, R, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(RX, RY, R * 0.6, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(RX, RY, R * 0.3, 0, TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(RX - R, RY); ctx.lineTo(RX + R, RY);
  ctx.moveTo(RX, RY - R); ctx.lineTo(RX, RY + R);
  ctx.stroke();

  // sweep
  const sweep = (game.time * 0.025) % TAU;
  ctx.save();
  ctx.beginPath(); ctx.arc(RX, RY, R, 0, TAU); ctx.clip();
  ctx.strokeStyle = "rgba(120,255,180,.35)";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(RX, RY);
  ctx.lineTo(RX + Math.cos(sweep) * R, RY + Math.sin(sweep) * R);
  ctx.stroke();
  ctx.restore();

  const RANGE = 2600;
  for (const e of enemies) {
    let dx = (e.x - player.x) / RANGE * R, dy = (e.y - player.y) / RANGE * R;
    const m = Math.hypot(dx, dy);
    const edgeDot = m > R - 3;
    if (edgeDot) { dx = dx / m * (R - 3); dy = dy / m * (R - 3); }
    ctx.fillStyle = edgeDot ? "rgba(255,110,110,.5)" : TYPES[e.type].color;
    ctx.beginPath();
    ctx.arc(RX + dx, RY + dy, e.type === "heavy" ? 4 : 3, 0, TAU);
    ctx.fill();
  }
  for (const p of pickups) {
    const dx = (p.x - player.x) / RANGE * R, dy = (p.y - player.y) / RANGE * R;
    if (Math.hypot(dx, dy) > R - 3) continue;
    ctx.fillStyle = p.kind === "hp" ? "#5ddba0" : "#ffd166";
    ctx.fillRect(RX + dx - 2, RY + dy - 2, 4, 4);
  }
  // self
  ctx.save();
  ctx.translate(RX, RY); ctx.rotate(player.angle);
  ctx.fillStyle = "#8fd3ff";
  ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill();
  ctx.restore();

  // --- banner
  if (bannerTime > 0) {
    const a = Math.min(1, bannerTime / 40);
    ctx.globalAlpha = a;
    ctx.textAlign = "center";
    ctx.font = "bold 34px ui-monospace, monospace";
    ctx.fillStyle = "#f4f8fc";
    ctx.shadowColor = "rgba(90,190,255,.8)"; ctx.shadowBlur = 22;
    ctx.fillText(bannerText, VW / 2, VH * 0.26);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // --- warnings
  const warn = [];
  if (player.alive && player.hp < 30) warn.push("HULL CRITICAL");
  const edge = HALF - 1000;
  const outside = Math.abs(player.x) > HALF - 120 || Math.abs(player.y) > HALF - 120;
  if (player.alive && (Math.abs(player.x) > edge || Math.abs(player.y) > edge))
    warn.push(outside ? "TURN BACK — TAKING DAMAGE" : "APPROACHING ZONE EDGE");
  if (warn.length && Math.floor(game.time / 18) % 2 === 0) {
    ctx.textAlign = "center";
    ctx.font = "bold 15px ui-monospace, monospace";
    ctx.fillStyle = "#ff5c5c";
    ctx.fillText("⚠ " + warn.join("   ⚠ "), VW / 2, VH - 42);
  }

  if (game.paused) {
    ctx.fillStyle = "rgba(5,10,16,.7)";
    ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = "center";
    ctx.font = "bold 40px ui-monospace, monospace";
    ctx.fillStyle = "#f4f8fc";
    ctx.fillText("PAUSED", VW / 2, VH / 2);
    ctx.font = "12px ui-monospace, monospace";
    ctx.fillStyle = "#6f8ba6";
    ctx.fillText("PRESS P TO RESUME", VW / 2, VH / 2 + 30);
  }
}

// ---------------------------------------------------------------- screens
function menuScreen() {
  panel.className = "panel";
  panel.innerHTML = `
    <h1>AFTERBURNER</h1>
    <div class="sub">Air Combat Maneuvering</div>
    <div class="keys">
      <b>Mouse / A · D</b><span>Steer the jet</span>
      <b>W / Shift</b><span>Afterburner</span>
      <b>S</b><span>Throttle back (turns tighter)</span>
      <b>Left Click / Space</b><span>Cannon</span>
      <b>Right Click / F</b><span>Fire missile (needs lock)</span>
      <b>P</b><span>Pause</span>
    </div>
    <button class="btn" id="go">Launch</button>
    <div class="hint">Survive the waves · collect + and M crates · don't leave the zone</div>`;
  overlay.classList.remove("hidden");
  document.getElementById("go").onclick = startGame;
}

function gameOver() {
  game.state = "dead";
  game.best = Math.max(game.best, game.score);
  try { localStorage.setItem("afterburner.best", String(game.best)); } catch (_) {}
  panel.className = "panel dead";
  panel.innerHTML = `
    <h1>SHOT DOWN</h1>
    <div class="sub">Ejection successful</div>
    <div class="stats">
      SCORE <span>${game.score}</span><br>
      KILLS <span>${game.kills}</span> &nbsp;·&nbsp; WAVE <span>${game.wave}</span><br>
      BEST <span>${game.best}</span>
    </div>
    <button class="btn" id="go">Fly Again</button>
    <div class="hint">or press ENTER</div>`;
  overlay.classList.remove("hidden");
  document.getElementById("go").onclick = startGame;
}

function makeClouds() {
  clouds = [];
  for (let i = 0; i < 90; i++) {
    const blobs = [];
    const n = 3 + Math.floor(Math.random() * 4);
    for (let j = 0; j < n; j++)
      blobs.push({ x: rand(-70, 70), y: rand(-26, 26), r: rand(34, 78) });
    clouds.push({
      x: rand(-HALF * 1.2, HALF * 1.2), y: rand(-HALF * 1.2, HALF * 1.2),
      layer: i < 55 ? 0 : 1, a: i < 55 ? rand(0.05, 0.12) : rand(0.08, 0.16),
      r: 90, blobs,
    });
  }
}

function startGame() {
  initAudio();
  if (actx && actx.state === "suspended") actx.resume();
  player = makePlayer();
  enemies = []; bullets = []; missiles = []; particles = []; pickups = []; rings = [];
  makeClouds();
  game.state = "playing"; game.paused = false;
  game.score = 0; game.wave = 0; game.kills = 0;
  game.waveTimer = 0; game.shake = 0; game.hitFlash = 0; game.time = 0;
  bannerTime = 0;
  overlay.classList.add("hidden");
  startWave();
}

// ---------------------------------------------------------------- loop
let acc = 0, last = performance.now();
const STEP = 1000 / 60;

function loop(now) {
  requestAnimationFrame(loop);
  let dt = now - last;
  last = now;
  if (dt > 250) dt = 250;          // tab was hidden — don't fast-forward
  acc += dt;

  if (game.state === "playing" && !game.paused) {
    while (acc >= STEP) { update(); acc -= STEP; }
  } else {
    acc = 0;
  }

  if (game.state !== "menu") render();
  else {
    ctx.fillStyle = "#0b1016";
    ctx.fillRect(0, 0, VW, VH);
  }
}

menuScreen();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
